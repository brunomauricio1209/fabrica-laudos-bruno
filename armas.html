<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Módulo de Armas</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: white;
    margin: 0;
}

.container {
    width: 420px;
}

h2 {
    text-align: center;
}

.perito {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #ef4444;
    margin-bottom: 20px;
}

.campo {
    margin-bottom: 15px;
}

.campo-check label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.campo-check input {
    width: 18px;
    height: 18px;
}

label {
    display: block;
    margin-bottom: 5px;
}

select, input, textarea {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background-color: white;
    color: black;
}

.hidden {
    display: none !important;
}

.botoes {
    margin-top: 20px;
}

button {
    width: 45%;
    padding: 12px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.avancar {
    background-color: #22c55e;
    color: white;
}

.finalizar {
    background-color: #3b82f6; /* azul */
    color: white;
}

.tela-centralizada {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.tela-scroll {
    display: flex;
    justify-content: center;
    padding: 20px 0;
}

.voltar { background-color: #475569; color: white; }
.salvar { background-color: #22c55e; color: white; }
</style>
</head>

<!-- ================= TELA SELEÇÃO ================= -->

<!-- ================= TELA ARMA (INALTERADA) ================= -->
<div id="telaArma" class="hidden tela tela-scroll">

<div class="container" style="text-align:center; margin-top:30px;">

<h2 style="margin-bottom:20px;">Descrição da Arma</h2>

<div class="campo">
<label>Tipo de disparo</label>
<select id="disparo">
<option value="">Selecione</option>
<option>repetição</option>
<option>semi-automática</option>
<option>automática</option>
</select>
</div>

<div class="campo">
<label>Tipo de arma</label>
<select id="tipo_arma">
<option value="">Selecione</option>
<option>revólver</option>
<option>pistola</option>
<option>espingarda</option>
<option>fuzil</option>
<option>metralhadora</option>
</select>
</div>

<div class="campo">
<label>Tipo de fabricação</label>
<select id="fabricacao">
<option value="">Selecione</option>
<option>artesanalmente</option>
<option>industrialmente</option>
</select>
</div>

<div class="campo">
<label>Oxidação</label>
<select id="oxidacao">
<option value="">Selecione</option>
<option>oxidada</option>
<option>inoxidada</option>
</select>
</div>

<div class="campo">
<label>Cabo</label>
<select id="cabo">
<option value="">Selecione</option>
<option>polímero</option>
<option>madeira</option>
<option>borracha / elastômero</option>
<option>metal</option>
<option>madrepérola</option>
</select>
</div>

<div class="campo">
<label>Marca</label>
<select id="marca" onchange="toggleOutro(this, 'marca_outro')">
<option value="">Selecione</option>
<option>Beretta</option>
<option>Boito</option>
<option>CBC / Magtech</option>
<option>CZ (Česká Zbrojovka)</option>
<option>Glock</option>
<option>Imbel</option>
<option>Rossi</option>
<option>SIG Sauer</option>
<option>Smith & Wesson</option>
<option>Taurus</option>
<option value="outro">Outro</option>
</select>
<input type="text" id="marca_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Modelo</label>
<input type="text" id="modelo">
</div>

<div class="campo">
<label>Calibre</label>
<select id="calibre" onchange="toggleOutro(this, 'calibre_outro')">
<option value="">Selecione</option>
<option>.22 LR</option>
<option>.25 ACP (6,35 mm)</option>
<option>.32 S&amp;W</option>
<option>.32 Auto / 32ACP / 7,65x17 Browning / 7,65 Browning Short</option>
<option>.357 Magnum</option>
<option>.38 SPL</option>
<option>.38 Super Auto +P*</option>
<option>.380 Auto / 380ACP / 9x17mm / 9mm Browning</option>
<option>9mm Luger / 9mm PARA / 9mm Parabellum / 9x19</option>
<option>.40 S&amp;W</option>
<option>.44 Rem Mag</option>
<option>.45 Auto</option>
<option>7.62x39 mm</option>
<option>7.62x51mm NATO</option>
<option>12 / 12GA / 12Gauge</option>
<option>16 / 16GA / 16Gauge</option>
<option>20 / 20GA / 20Gauge</option>
<option>24 / 24GA / 24Gauge</option>
<option>28 / 28GA / 28Gauge</option>
<option>32 / 32GA / 32Gauge</option>
<option>.50 BMG / .50 Browning</option>
<option value="outro">DESCREVER</option>
</select>
<input type="text" id="calibre_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Comprimento do cano</label>
<select id="cano" onchange="toggleOutro(this, 'cano_outro')">
<option value="">Selecione</option>
<option>2" polegadas / 50,8 milímetros</option>
<option>3" polegadas / 76,2 milímetros</option>
<option>3.5" polegadas / 88,9 milímetros</option>
<option>4" polegadas / 101,6 milímetros</option>
<option>5" polegadas / 127 milímetros</option>
<option>6" polegadas / 152,4 milímetros</option>
<option value="outro">Outro</option>
</select>
<input type="text" id="cano_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Número de série</label>
<input type="text" id="serie">
</div>

<div class="campo">
<label>Capacidade</label>
<select id="capacidade" onchange="toggleOutro(this, 'capacidade_outro')">
<option value="">Selecione</option>
<option>1 munição</option>
<option>2 munições</option>
<option>3 munições</option>
<option>4 munições</option>
<option>5 munições</option>
<option>6 munições</option>
<option>7 munições</option>
<option>8 munições</option>
<option>9 munições</option>
<option>10 munições</option>
<option>12 munições</option>
<option>15 munições</option>
<option>15 munições (14+1)</option>
<option>17 munições</option>
<option>17 munições (16+1)</option>
<option>19 munições</option>
<option>19 munições (18+1)</option>
<option>20 munições</option>
<option>20 munições (19+1)</option>
<option>30 munições</option>
<option>40 munições</option>
<option>Não identificado</option>
<option value="outro">DESCREVER</option>
</select>
<input type="text" id="capacidade_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Alma</label>
<select id="alma">
<option value="">Selecione</option>
<option>raiada</option>
<option>lisa</option>
</select>
</div>

<div class="campo">
<label>Tipo de cão</label>
<select id="cao" onchange="toggleOutro(this, 'cao_outro')">
<option value="">Selecione</option>
<option>Cão aparente, percutor externo</option>
<option>Cão aparente, percutor interno</option>
<option>Cão não aparente, percutor interno</option>
<option>Sem cão, percutor interno</option>
<option>Cão semi-aparente, percutor interno</option>
<option>Cão rebatido, percutor interno</option>
<option>Não identificado</option>
<option>Não se aplica</option>
<option value="outro">Outro</option>
</select>
<input type="text" id="cao_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Observações</label>
<textarea id="obs"></textarea>
</div>

<div class="campo">
<label>Eficácia</label>
<select id="eficacia" onchange="toggleOutro(this, 'eficacia_outro')">
<option value="">Selecione</option>
<option>EFICAZ</option>
<option>INEFICAZ</option>
<option value="outro">Outro</option>
</select>
<input type="text" id="eficacia_outro" class="hidden" placeholder="Descrever">
</div>

<div class="campo">
<label>Recenticidade</label>
<select id="recent">
<option value="">Selecione</option>
<option>POSITIVO</option>
<option>NEGATIVO</option>
<option>PREJUDICADO</option>
<option>EM BRANCO</option>
</select>
</div>

<div class="campo">
<label>Lacre de saída arma</label>
<input type="text" id="lsarma">
</div>

<button class="avancar" onclick="salvarArma()">Salvar e voltar</button>
<button class="voltar" onclick="mostrarTela('telaSelecao')">Voltar</button>

</div> <!-- container -->
</div> <!-- telaArma -->

<!-- BOTÕES -->
<div style="display:flex; gap:10px; margin-top:20px;">

<button class="voltar" style="flex:1;" onclick="mostrarTela('telaSelecao')">Voltar</button>

</div>
</div>


<!-- ================= TELA SIMULACRO ================= -->
<div id="telaSimulacro" class="hidden tela tela-scroll">

<div class="container" style="text-align:center; margin-top:30px;">

/* ================= CONTROLE DE TELAS ================= */

function mostrarTela(id) {
    document.querySelectorAll(".tela").forEach(t => t.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

/* ================= CONTROLE CAMPO TOTAL ================= */

function controlarCampoTotal() {

    const campoTotal = document.getElementById("municao_total").parentElement;

    if (municaoIndex === 1) {
        campoTotal.classList.remove("hidden");
    } else {
        campoTotal.classList.add("hidden");
    }
}

/* ================= CONTROLE MUNIÇÃO ================= */

let municaoIndex = 1;

/* ================= CONTROLE LACRE MUNIÇÃO ================= */

function controlarLacreMunicao() {

    const campo = document.getElementById("campo_lacre_municao");

    if (municaoIndex === 1) {
        campo.classList.remove("hidden");
    } else {
        campo.classList.add("hidden");
    }
}

/* ================= SALVAR PREAMBULO ================= */

function salvarPreambulo() {

    const perito = document.getElementById("perito").value;
    const rep = document.getElementById("rep").value;
    const bo = document.getElementById("bo").value;
    const saep = document.getElementById("saep").value;
    const cidade = document.getElementById("cidade").value;
    const delegado = document.getElementById("delegado").value;

    if (!perito || !rep || !cidade || !delegado) {
        alert("Preencha os campos obrigatórios!");
        return;
    }

    const data = document.getElementById("data").value;

    const timestamp = new Date().toLocaleString("pt-BR");

    localStorage.setItem("timestamp", timestamp);
    localStorage.setItem("perito", perito);
    localStorage.setItem("rep", rep);
    localStorage.setItem("bo", bo);
    localStorage.setItem("saep", saep);
    localStorage.setItem("data", data);
    localStorage.setItem("cidade", cidade);
    localStorage.setItem("delegado", delegado);

    mostrarTela("telaSelecao");
}


/* ================= NAVEGAÇÃO ================= */

function avancar() {

    if (document.getElementById("sel_arma").checked) {
        mostrarTela("telaArma");
        return;
    }

    if (document.getElementById("sel_municao").checked) {
    municaoIndex = 1;
    document.getElementById("numMunicao").innerText = municaoIndex;
    mostrarTela("telaMunicao");
    controlarCampoTotal();
    controlarLacreMunicao();
    return;
    }

    if (document.getElementById("sel_coldre").checked) {
        mostrarTela("telaColdre");
        return;
    }

    if (document.getElementById("sel_simulacro").checked) {
        mostrarTela("telaSimulacro");
        return;
    }

    alert("Selecione um item");
}

function voltar() {
    window.location.href = "index.html";
}


/* ================= FLAGS ================= */

function setFlag(tipo, marcado) {
    if (marcado) localStorage.setItem(tipo, "SIM");
    else localStorage.setItem(tipo, "NÃO");
}


/* ================= UTILITÁRIOS ================= */

function toggleOutro(select, id) {
    const campo = document.getElementById(id);
    if (select.value === "outro") {
        campo.classList.remove("hidden");
    } else {
        campo.classList.add("hidden");
        campo.value = "";
    }
}

function valor(id, outroId) {
    const v = document.getElementById(id).value;

    if (v === "outro") {
        const outro = document.getElementById(outroId).value.trim();
        return outro !== "" ? outro : "Não informado";
    }

    return v;
}


/* ================= SALVAR ARMA ================= */

function salvarArma() {

    // CAPTURA DOS VALORES
    const disparo = document.getElementById("disparo").value;

    const calibre = valor("calibre", "calibre_outro");
    const cano = valor("cano", "cano_outro");

    const serie = document.getElementById("serie").value;
    const capacidade = valor("capacidade", "capacidade_outro");

    const alma = document.getElementById("alma").value;
    const cao = valor("cao", "cao_outro");

    const obs = document.getElementById("obs").value;

    const eficacia = valor("eficacia", "eficacia_outro");
    const recente = document.getElementById("recent").value;
    const lsarma = document.getElementById("lsarma").value;

    // SALVAMENTO NO LOCALSTORAGE
    localStorage.setItem("arma_disparo", disparo);
    localStorage.setItem("arma_tipo", tipo);

    localStorage.setItem("arma_oxidacao", oxidacao);

    localStorage.setItem("arma_marca", marca);

    localStorage.setItem("arma_eficacia", eficacia);
    localStorage.setItem("arma_recente", recente);
    localStorage.setItem("lacre_saida_arma", lsarma);

    alert("Dados da arma salvos 👊");
    mostrarTela("telaSelecao");

function salvarMunicao() {

    // QUANTIDADE TOTAL (fora do índice)
    const total = document.getElementById("municao_total").value;
    localStorage.setItem("municao_total", total);

    const estojo = valor("m_estojo", "m_estojo_outro");
    const proj = valor("m_proj", "m_proj_outro");
    const eficaz = valor("m_eficaz", "m_eficaz_outro");

    const prefixo = "m" + municaoIndex + "_";

    salvarMunicaoInterno();

    // CONTROLE DE LIMITE
    if (municaoIndex === 6) {
        alert("Total de munições excedidas, preencha quando for fazer o Laudo");
        return;
    }

    // AVANÇA ÍNDICE
    municaoIndex++;

    // ATUALIZA TÍTULO
    document.getElementById("numMunicao").innerText = municaoIndex;

    // LIMPA CAMPOS
    limparCamposMunicao();

    controlarCampoTotal();
    controlarLacreMunicao();
}

    const total = document.getElementById("municao_total").value;

    document.getElementById("m_estojo_outro").value = "";

    document.getElementById("m_proj").value = "";

    document.getElementById("m_eficaz").value = "";
    document.getElementById("m_eficaz_outro").value = "";
    document.getElementById("m_eficaz_outro").classList.add("hidden");
}

/* ================= FINALIZAR ================= */

function flagMunicao() {

    for (let i = 1; i <= 6; i++) {
        const qtde = localStorage.getItem("m" + i + "_qtde");

        if (qtde && qtde.trim() !== "") {
            return "SIM";

    return "NÃO";

    const campos = [

    for (let c of campos) {

            return "SIM";
